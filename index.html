<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Aplikasi Inventaris API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  
  <nav class="bg-blue-600 p-4 shadow-md text-white sticky top-0 z-50 flex justify-between items-center px-8">
    <div class="flex items-center">
      <i class="fas fa-boxes text-2xl mr-3"></i>
      <h1 class="text-xl font-bold tracking-wide">InventarisKu (API Secure)</h1>
    </div>
    <div class="text-xs bg-blue-800 px-3 py-1.5 rounded-full flex items-center">
      <i class="fas fa-shield-alt text-green-400 mr-2"></i> Token Auth Active
    </div>
  </nav>

  <div class="container mx-auto mt-8 px-4 flex flex-col lg:flex-row gap-8 pb-10">
    
    <!-- Form Input -->
    <div class="w-full lg:w-1/3">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-24">
        <h2 class="text-lg font-bold mb-5 text-gray-700 border-b pb-2" id="formTitle">Tambah Barang Baru</h2>
        
        <form id="inventoryForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="itemId">
          
          <div class="mb-4">
            <label class="block text-gray-600 text-sm font-semibold mb-2">Nama Barang</label>
            <input type="text" id="nama" required placeholder="Contoh: Laptop Asus" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition">
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-600 text-sm font-semibold mb-2">SKU / Kode</label>
            <input type="text" id="sku" required placeholder="SKU-001" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition">
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-600 text-sm font-semibold mb-2">Kategori</label>
            <select id="kategori" required class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition">
              <option value="">-- Pilih Kategori --</option>
              <option value="Elektronik">Elektronik</option>
              <option value="Pakaian">Pakaian</option>
              <option value="Makanan">Makanan</option>
              <option value="Furnitur">Furnitur</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          
          <div class="flex gap-4 mb-6">
            <div class="w-1/3">
              <label class="block text-gray-600 text-sm font-semibold mb-2">Jumlah</label>
              <input type="number" id="jumlah" required min="0" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition">
            </div>
            <div class="w-2/3">
              <label class="block text-gray-600 text-sm font-semibold mb-2">Harga (Rp)</label>
              <input type="number" id="harga" required min="0" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition">
            </div>
          </div>
          
          <div class="flex gap-3">
            <button type="submit" id="submitBtn" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg shadow hover:bg-blue-700 w-full font-medium transition-colors flex justify-center items-center">
              <i class="fas fa-save mr-2"></i> Simpan
            </button>
            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-200 text-gray-700 px-4 py-2.5 rounded-lg shadow hover:bg-gray-300 transition-colors font-medium">
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="w-full lg:w-2/3">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
          <h2 class="text-lg font-bold text-gray-700">Daftar Inventaris</h2>
          
          <div id="loading" class="hidden flex items-center text-blue-600 mt-2 sm:mt-0">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-5 w-5 mr-2"></div>
            <span class="text-sm font-semibold animate-pulse">Menghubungi API...</span>
          </div>
        </div>
        
        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="w-full text-left whitespace-nowrap">
            <thead>
              <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                <th class="p-4 font-semibold">Nama & SKU</th>
                <th class="p-4 font-semibold">Kategori</th>
                <th class="p-4 font-semibold text-center">Stok</th>
                <th class="p-4 font-semibold text-right">Harga Satuan</th>
                <th class="p-4 font-semibold text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="text-sm divide-y divide-gray-100">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // KONFIGURASI API & TOKEN
    // Jika aplikasi di-deploy via Web App Apps Script, location.href akan mengarah ke URL Web App itu sendiri.
    const API_URL = window.location.href.split('?')[0];
    const API_TOKEN = 'RAHASIA_TOKEN_INVENTARIS_2026'; 

    let inventoryData = [];

    const formatRupiah = (angka) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    window.onload = () => loadData();

    function toggleLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = show;
      show ? submitBtn.classList.add('opacity-70', 'cursor-not-allowed') : submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
    }

    // Fungsi Utama Client API Call
    async function requestAPI(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          // Menjaga jenis konten agar kompatibel tanpa preflight masalah CORS di Apps Script
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: API_TOKEN,
            action: action,
            payload: payload
          })
        });

        const result = await response.json();

        if (result.status === 'error') {
          throw new Error(result.message);
        }

        return result.data;
      } catch (err) {
        alert('Kesalahan API: ' + err.message);
        throw err;
      }
    }

    async function loadData() {
      toggleLoading(true);
      try {
        inventoryData = await requestAPI('getItems');
        renderTable();
      } finally {
        toggleLoading(false);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (!inventoryData || inventoryData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400 italic">Belum ada data barang di database.</td></tr>';
        return;
      }

      inventoryData.forEach(item => {
        const isLowStock = item.jumlah < 5;
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-blue-50 transition-colors';
        tr.innerHTML = `
          <td class="p-4">
            <div class="font-bold text-gray-800">${item.nama}</div>
            <div class="text-xs text-gray-500 font-mono mt-1"><i class="fas fa-barcode mr-1"></i>${item.sku}</div>
          </td>
          <td class="p-4">
            <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">${item.kategori}</span>
          </td>
          <td class="p-4 text-center">
            <span class="font-bold text-lg ${isLowStock ? 'text-red-500' : 'text-green-600'}">${item.jumlah}</span>
            ${isLowStock ? '<div class="text-[10px] text-red-500 font-bold uppercase mt-1">Stok Menipis</div>' : ''}
          </td>
          <td class="p-4 text-right font-medium text-gray-700">${formatRupiah(item.harga)}</td>
          <td class="p-4 text-center">
            <button onclick="editItem('${item.id}')" class="bg-yellow-100 text-yellow-600 p-2 rounded hover:bg-yellow-200 mx-1 transition-colors" title="Edit">
              <i class="fas fa-pen text-sm"></i>
            </button>
            <button onclick="deleteItem('${item.id}')" class="bg-red-100 text-red-600 p-2 rounded hover:bg-red-200 mx-1 transition-colors" title="Hapus">
              <i class="fas fa-trash text-sm"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const item = {
        nama: document.getElementById('nama').value,
        sku: document.getElementById('sku').value,
        kategori: document.getElementById('kategori').value,
        jumlah: parseInt(document.getElementById('jumlah').value),
        harga: parseInt(document.getElementById('harga').value)
      };

      toggleLoading(true);
      try {
        if (id) {
          inventoryData = await requestAPI('updateItem', { id, item });
        } else {
          inventoryData = await requestAPI('addItem', item);
        }
        renderTable();
        resetForm();
      } finally {
        toggleLoading(false);
      }
    }

    function editItem(id) {
      const item = inventoryData.find(i => i.id === id);
      if (item) {
        document.getElementById('itemId').value = item.id;
        document.getElementById('nama').value = item.nama;
        document.getElementById('sku').value = item.sku;
        document.getElementById('kategori').value = item.kategori;
        document.getElementById('jumlah').value = item.jumlah;
        document.getElementById('harga').value = item.harga;
        
        document.getElementById('formTitle').innerText = 'Edit Data Barang';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-check mr-2"></i> Update Barang';
        document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-green-600');
        document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
        document.getElementById('cancelBtn').classList.remove('hidden');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function deleteItem(id) {
      if(confirm('Hapus barang ini dari database secara permanen?')) {
        toggleLoading(true);
        try {
          inventoryData = await requestAPI('deleteItem', { id });
          renderTable();
        } finally {
          toggleLoading(false);
        }
      }
    }

    function resetForm() {
      document.getElementById('inventoryForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('formTitle').innerText = 'Tambah Barang Baru';
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan';
      btn.classList.replace('bg-green-600', 'bg-blue-600');
      btn.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
      document.getElementById('cancelBtn').classList.add('hidden');
    }
  </script>
</body>
</html>
