<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Inventaris Barang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; justify-content: center; align-items: center; }
  </style>
</head>
<body class="bg-light">

<div class="loading-overlay" id="loading">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<div class="container py-4">
  <!-- Top Navigation & Status Bar -->
  <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded">
    <div>
      <h3 class="m-0 fw-bold">Dashboard Inventaris</h3>
      <span class="badge bg-secondary fs-6 mt-1" id="roleBadge">Status: GUEST (Tanpa Login)</span>
    </div>
    <div>
      <button class="btn btn-primary" id="btnLogin" data-bs-toggle="modal" data-bs-target="#loginModal">Log In</button>
      <button class="btn btn-outline-danger d-none" id="btnLogout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <!-- Form Tambah Data (Muncul untuk PETUGAS & ADMIN) -->
  <div class="card mb-4 shadow-sm d-none" id="crudSection">
    <div class="card-header bg-primary text-white font-weight-bold">Tambah Barang Baru</div>
    <div class="card-body">
      <form id="addForm" class="row g-3">
        <div class="col-md-4">
          <input type="text" id="addNamaBarang" class="form-control" placeholder="Nama Barang" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="addStok" class="form-control" placeholder="Stok" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="addKategori" class="form-control" placeholder="Kategori" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Tambah</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabel Data Barang -->
  <div class="card shadow-sm">
    <div class="card-header bg-white font-weight-bold d-flex justify-content-between align-items-center">
      <span>Daftar Barang (Google Sheets)</span>
      <button class="btn btn-sm btn-outline-primary" onclick="loadData()">Refresh Data</button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover m-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nama Barang</th>
              <th>Stok</th>
              <th>Kategori</th>
              <th id="thAksi" class="d-none">Aksi</th>
            </tr>
          </thead>
          <tbody id="dataTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Login -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Sistem Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="loginUsername" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Masuk</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal Edit Data -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Barang</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Nama Barang</label>
            <input type="text" id="editNamaBarang" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Stok</label>
            <input type="number" id="editStok" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Kategori</label>
            <input type="text" id="editKategori" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // GANTI DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT ANDA
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQxRwo8MnsN8Zq7TdjQF4tYztqYBZQ1_mP8KitByrWEWO8cbB5a28FQz_0djzeFhXrIA/exec";

  let currentUser = JSON.parse(sessionStorage.getItem('user')) || { role: 'GUEST' };

  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'flex' : 'none';
  }

  // Update UI Berdasarkan Role User
  function renderRoleUI() {
    const roleBadge = document.getElementById('roleBadge');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const crudSection = document.getElementById('crudSection');
    const thAksi = document.getElementById('thAksi');

    if (currentUser.role === 'GUEST') {
      roleBadge.className = "badge bg-secondary fs-6 mt-1";
      roleBadge.innerText = "Status: GUEST (Tanpa Login)";
      btnLogin.classList.remove('d-none');
      btnLogout.classList.add('d-none');
      crudSection.classList.add('d-none');
      thAksi.classList.add('d-none');
    } else {
      roleBadge.className = currentUser.role === 'ADMIN' ? "badge bg-danger fs-6 mt-1" : "badge bg-success fs-6 mt-1";
      roleBadge.innerText = `Status: ${currentUser.role} (${currentUser.username})`;
      btnLogin.classList.add('d-none');
      btnLogout.classList.remove('d-none');
      
      // Petugas & Admin bisa tambah/edit data
      crudSection.classList.remove('d-none');
      thAksi.classList.remove('d-none');
    }
    loadData();
  }

  // Fungsi Kirim Request ke Apps Script
  async function apiCall(payload) {
    showLoading(true);
    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      showLoading(false);
      return data;
    } catch (err) {
      showLoading(false);
      alert('Terjadi kesalahan koneksi ke server.');
      console.error(err);
      return { success: false };
    }
  }

  // Load Data dari Spreadsheet
  async function loadData() {
    const result = await apiCall({ action: 'READ' });
    const tbody = document.getElementById('dataTable');
    tbody.innerHTML = '';

    if (result.success && result.data.length > 0) {
      result.data.forEach(item => {
        let tr = `<tr>
          <td>${item.id}</td>
          <td>${item.namaBarang}</td>
          <td>${item.stok}</td>
          <td>${item.kategori}</td>`;

        if (currentUser.role !== 'GUEST') {
          tr += `<td>
            <button class="btn btn-sm btn-warning text-white me-1" onclick="openEditModal('${item.id}', '${item.namaBarang}', ${item.stok}, '${item.kategori}')">Edit</button>`;
          if (currentUser.role === 'ADMIN') {
            tr += `<button class="btn btn-sm btn-danger" onclick="deleteData('${item.id}')">Hapus</button>`;
          }
          tr += `</td>`;
        }
        tr += `</tr>`;
        tbody.innerHTML += tr;
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-3 text-muted">Belum ada data barang.</td></tr>`;
    }
  }

  // Handle Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;

    const res = await apiCall({ action: 'LOGIN', username, password });
    if (res.success) {
      currentUser = res.user;
      sessionStorage.setItem('user', JSON.stringify(currentUser));
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      document.getElementById('loginForm').reset();
      renderRoleUI();
    } else {
      alert(res.message);
    }
  });

  // Handle Logout
  function logout() {
    sessionStorage.removeItem('user');
    currentUser = { role: 'GUEST' };
    renderRoleUI();
  }

  // Handle Tambah Data
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      action: 'CREATE',
      role: currentUser.role,
      namaBarang: document.getElementById('addNamaBarang').value,
      stok: document.getElementById('addStok').value,
      kategori: document.getElementById('addKategori').value
    };

    const res = await apiCall(payload);
    if (res.success) {
      document.getElementById('addForm').reset();
      loadData();
    } else {
      alert(res.message);
    }
  });

  // Modal Edit Data
  function openEditModal(id, nama, stok, kategori) {
    document.getElementById('editId').value = id;
    document.getElementById('editNamaBarang').value = nama;
    document.getElementById('editStok').value = stok;
    document.getElementById('editKategori').value = kategori;
    new bootstrap.Modal(document.getElementById('editModal')).show();
  }

  // Handle Update Data
  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      action: 'UPDATE',
      role: currentUser.role,
      id: document.getElementById('editId').value,
      namaBarang: document.getElementById('editNamaBarang').value,
      stok: document.getElementById('editStok').value,
      kategori: document.getElementById('editKategori').value
    };

    const res = await apiCall(payload);
    if (res.success) {
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
      loadData();
    } else {
      alert(res.message);
    }
  });

  // Handle Hapus Data (Hanya Admin)
  async function deleteData(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;
    const res = await apiCall({ action: 'DELETE', role: currentUser.role, id });
    if (res.success) {
      loadData();
    } else {
      alert(res.message);
    }
  }

  // Inisialisasi awal
  renderRoleUI();
</script>
</body>
</html>
